# APPLIACTIONS BLUR
#windowrule = noblur, tag:multimedia_video*
#windowrule = opacity 1.0, tag:multimedia_video*
#windowrule = opacity 0.8, tag:settings*
#windowrule = opacity 0.8, class:^(org.gnome.Nautilus)$
#windowrule = opacity 0.9, class:^(gedit|org.gnome.TextEditor|mousepad)$
#windowrule = opacity 0.9, class:^(org.pulseaudio.pavucontrol)$
#windowrule = opacity 0.9, class:^(kitty)$
#windowrule = opacity 0.85 override 0.7 override 1 override, class:^(discord|vesktop|org.telegram.desktop)$
#windowrule = opacity 0.8 override 0.6 override 1 override, class:^(Spotify)$
#windowrule = opacity 0.9 override 0.7 override 1 override, class:^(zen)$
#windowrule = opacity 0.8 override 0.6 override 1 override, tag:viewer*

# Блюр для мультимедиа
windowrule {
    name = noblur
    match:tag = multimedia_video*
}

windowrule {
    name = opacity 1.0
    match:tag = multimedia_video*
}

# Настройки и системные приложения
windowrule {
    name = opacity 0.8
    match:tag = settings*
}

windowrule {
    name = opacity 0.8
    match:class = ^(org.gnome.Nautilus)$
}

# Текстовые редакторы
windowrule {
    name = opacity 0.9
    match:class = ^(gedit|org.gnome.TextEditor|mousepad)$
}

windowrule {
    name = opacity 0.9
    match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
    name = opacity 0.9
    match:class = ^(kitty)$
}

# Мессенджеры
windowrule {
    name = opacity 0.85 override 0.7 override 1 override
    match:class = ^(discord|vesktop|org.telegram.desktop)$
}

# Музыка
windowrule {
    name = opacity 0.8 override 0.6 override 1 override
    match:class = ^(Spotify)$
}

# LAYER RULES
#layerrule = blur, rofi
#layerrule = ignorezero, rofi
#layerrule = ignorealpha 0.5, rofi
#layerrule = dimaround, rofi
#layerrule = animation popin 10%, rofi
#layerrule = blur, notifications
#layerrule = ignorezero, notifications //
#layerrule = blur, waybar
##layerrule = ignorezero, waybar //
#layerrule = ignorealpha 0.5, waybar
#layerrule = ignorealpha 0.5, tag:notif*
#layerrule = blur, logout_dialog
#
## SWAYNC BLUR & XRAY
#layerrule = blur, swaync-control-center
#layerrule = blur, swaync-notification-window
#layerrule = ignorezero, swaync-control-center
#layerrule = ignorezero, swaync-notification-window
#layerrule = ignorealpha 0.5, swaync-control-center
#layerrule = ignorealpha 0.5, swaync-notification-window
#layerrule = xray 0, swaync-control-center
#layerrule = xray 0, swaync-notification-window


# Waybar
layerrule {
    name = blur on
    match:namespace = waybar
}

# Уведомления (если они имеют namespace notif*)
layerrule {
    name = ignore_alpha 0.5
    match:namespace = notif*
}

# Диалог выхода
layerrule {
    name = blur on
    match:namespace = logout_dialog
}

# SWAYNC
layerrule {
    name = blur on
    match:namespace = swaync-control-center
}

layerrule {
    name = blur on
    match:namespace = swaync-notification-window
}

layerrule {
    name = ignore_alpha 0.5
    match:namespace = swaync-control-center
}

layerrule {
    name = ignore_alpha 0.5
    match:namespace = swaync-notification-window
}

layerrule {
    name = xray 0
    match:namespace = swaync-control-center
}

#FLOAT
#windowrule = float, tag:settings*
#windowrule = float, tag:viewer*
#windowrule = float, tag:multimedia_video*
#windowrule = size 900 506, tag:multimedia_video*
#windowrule = float, class:^(org.pulseaudio.pavucontrol)$
#windowrule = size 50% 60%, class:^(org.pulseaudio.pavucontrol)$
#
## Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*
#
## Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
#
## POP UPS AND DIALOGUES
#windowrule = float, title:^(Save As|Save a File|Pick Files)$
#windowrule = size 50% 60%, title:^(Save As|Save a File|Pick Files)$
#windowrule = center, title:^(Save As|Save a File|Pick Files)$
#
#windowrule = float, initialTitle:(Open Files)
#windowrule = size 70% 60%, initialTitle:(Open Files)

# Плавающие окна по тегам
windowrule {
    name = float
    match:tag = settings*
}

windowrule {
    name = float
    match:tag = viewer*
}

windowrule {
    name = float
    match:tag = multimedia_video*
}

windowrule {
    name = size 900 506
    match:tag = multimedia_video*
}

# Pavucontrol
windowrule {
    name = float
    match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
    name = size 50% 60%
    match:class = ^(org.pulseaudio.pavucontrol)$
}

# Игнорирование запросов максимизации от приложений
windowrule {
    name = suppressevent maximize
    match:class = .*
}

# Исправление проблем с перетаскиванием в XWayland
windowrule {
    name = nofocus
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
}

# Всплывающие окна и диалоги
windowrule {
    name = float
    match:title = ^(Save As|Save a File|Pick Files)$
}

windowrule {
    name = size 50% 60%
    match:title = ^(Save As|Save a File|Pick Files)$
}

windowrule {
    name = center
    match:title = ^(Save As|Save a File|Pick Files)$
}

windowrule {
    name = float
    match:initial_title = (Open Files)
}

windowrule {
    name = size 70% 60%
    match:initial_title = (Open Files)
}
